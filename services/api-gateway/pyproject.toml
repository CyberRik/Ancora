[project]
name = "ancora-api"
version = "0.1.0"
description = "Ancora API Gateway — REST (and later WebSocket) control plane."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.6",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "temporalio>=1.9,<2",
    "ancora",
    "ancora-common",
    # Replay (Phase 4d) feeds a run's history back through the workflow definitions
    # to verify determinism; those live in the worker package. Imported lazily in
    # the replay path only — the control plane needs the worker's code for nothing
    # else, and degrades to a clear error if it is absent.
    "ancora-worker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ancora_api"]
