[project]
name = "ancora-event-consumer"
version = "0.1.0"
description = "Ancora event consumer — projects the Redis Streams event bus and reconciles run status from Temporal."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "temporalio>=1.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.7",
    # Minimal health/metrics HTTP surface (Phase 4c).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "ancora-common",
    # Dev hot-reload wrapper for the local Docker stack (see docker-compose.yml).
    "watchfiles>=0.24",
]

[project.scripts]
ancora-event-consumer = "ancora_event_consumer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ancora_event_consumer"]
