# Load JSON dashboards from disk so the Ancora overview is present on first boot.
apiVersion: 1

providers:
  - name: ancora
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
